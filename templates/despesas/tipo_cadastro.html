{% extends "base/base.html" %}

{% block title %}
  {{ 'Editar Tipo de Despesa' if tipo_despesa else 'Cadastrar Tipo de Despesa' }}{% endblock %}
{% block content %}

<div id="conteudo-projetos">
  <h2>{{ '✍ Editar Tipo de Despesa' | safe  if tipo_despesa else '&#10133; Adicionar Tipo de Despesa' | safe }}</h2>
  <hr>
 
  <form method="post" id="form-cadastro-tipo-despesa" onsubmit="return validarFormulario();">

    <div class="form-group">
      <label for="nome">Descrição: <span class="erro">*</span></label>
      <input type="text" id="nome" name="nome" value="{{ tipo_despesa.nome if tipo_despesa else '' }}"required>
    </div>

    <div class="form-group">
      <label for="observacao">Observação: <span class="erro">*</span></label>
      <input type="text" id="observacao" name="observacao" value="{{ tipo_despesa.observacao if tipo_despesa else '' }}"required>
    </div>

    <div class="form-group botoes">
      <input type="submit" value="Salvar" class="btn-salvar"> 
      <a href="{{ url_for('despesas.despesa_listar_tipo') }}" class="btn-cancelar">Cancelar</a>
    </div>

  </form>
</div>

<style>
  /* Estilo geral */
  #conteudo-projetos {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    font-family: Arial, sans-serif;
  }

  h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }

  hr {
    border: none;
    border-top: 1px solid #ddd;
    margin-bottom: 20px;
  }

  /* Estilo dos campos do formulário */
  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 14px;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: #007BFF;
    outline: none;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
  }

  .erro {
    color: red;
    font-size: 12px;
    display: none;
    margin-left: 4px;
  }

  /* Botões */
.botoes {
    display: flex; /* Alinha os botões lado a lado */
    justify-content: center; /* Centraliza os botões horizontalmente */
    gap: 15px; /* Espaço entre os botões */
    margin-top: 20px;
  }

  .btn-salvar {
    background-color: #007BFF;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
  }

  .btn-salvar:hover {
    background-color: #0056b3;
  }

  .btn-cancelar {
    background-color: #6c757d;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
    margin-left: 10px;
    text-decoration: none;
  }

  .btn-cancelar:hover {
    background-color: #5a6268;
  }
</style>

<script>
  function validarFormulario() {
    let valido = true;

    // Campos obrigatórios
    const camposObrigatorios = [
      'nome'
    ];

    camposObrigatorios.forEach(function(campoId) {
      const campo = document.getElementById(campoId);
      const label = campo.previousElementSibling.querySelector('.erro');

      if (!campo.value.trim()) {
        campo.value = '';
        if (label) label.style.display = 'inline';
        valido = false;
      } else {
        if (label) label.style.display = 'none';
      }
    });

    return valido;
  }
</script>

{% endblock %}
